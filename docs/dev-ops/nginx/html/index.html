<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="theme-color" content="#e02e24">
    <title>HJS 拼团商城</title>
    <link rel="icon" href="images/placeholder-product.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
<header class="topbar">
    <div class="topbar-row">
        <div class="brand">
            <span class="brand-mark">拼</span>
            <div>
                <strong>HJS 拼团</strong>
                <small>好货一起拼 · 省得更开心</small>
            </div>
        </div>
        <div class="top-actions">
            <a id="identityLink" class="identity-link" href="login.html">选择用户</a>
            <a class="admin-link" href="admin/login.html">运营后台</a>
        </div>
    </div>
    <form id="searchForm" class="search-box">
        <span aria-hidden="true">⌕</span>
        <input id="searchInput" type="search" placeholder="搜索你想拼的好货" autocomplete="off">
        <button type="submit">搜索</button>
    </form>
</header>

<main class="page-shell">
    <section class="hero">
        <div class="hero-copy">
            <span class="hero-badge">限时拼团</span>
            <h1>百亿补贴式好价<br>低至 2 人成团</h1>
            <p>精选日用百货 · 新鲜水果 · 数码好物</p>
            <button id="heroAction" type="button">立即抢购</button>
        </div>
        <div class="hero-art" aria-hidden="true">
            <span>¥</span>
            <strong>拼</strong>
        </div>
    </section>

    <section class="benefits" aria-label="商城保障">
        <div><b>✓</b><span>全场包邮<small>偏远地区除外</small></span></div>
        <div><b>闪</b><span>极速退款<small>到账更省心</small></span></div>
        <div><b>保</b><span>正品保障<small>品质放心购</small></span></div>
        <div><b>赔</b><span>破损包赔<small>售后有保障</small></span></div>
    </section>

    <nav id="categoryNav" class="category-nav" aria-label="商品分类">
        <button class="active" data-category="全部"><span>🔥</span>全部</button>
        <button data-category="生鲜水果"><span>🍓</span>水果</button>
        <button data-category="家清纸品"><span>🧻</span>家清</button>
        <button data-category="食品零食"><span>🥜</span>零食</button>
        <button data-category="数码电器"><span>🎧</span>数码</button>
        <button data-category="家居生活"><span>🥤</span>家居</button>
        <button data-category="宠物用品"><span>🐾</span>宠物</button>
        <button data-category="学习办公"><span>📚</span>学习</button>
    </nav>

    <nav id="sortNav" class="sort-nav" aria-label="商品排序">
        <button class="active" data-sort="default">综合</button>
        <button data-sort="sales">销量</button>
        <button data-sort="price_asc">价格从低到高</button>
        <button data-sort="price_desc">价格从高到低</button>
    </nav>

    <section class="section-heading">
        <div>
            <span class="heading-accent"></span>
            <h2>大家都在拼</h2>
            <small id="resultSummary">正在加载今日好货</small>
        </div>
        <button id="refreshButton" type="button">换一批</button>
    </section>

    <section id="productGrid" class="product-grid" aria-live="polite">
        <article class="product-card skeleton"></article>
        <article class="product-card skeleton"></article>
        <article class="product-card skeleton"></article>
        <article class="product-card skeleton"></article>
    </section>

    <div id="emptyState" class="empty-state" hidden>
        <span>🛍️</span>
        <h3>没有找到相关商品</h3>
        <p>换个关键词或分类再试试吧</p>
        <button type="button">查看全部好货</button>
    </div>
</main>

<footer class="mobile-tabbar">
    <a class="active" href="index.html"><span>⌂</span>首页</a>
    <a href="#categoryNav"><span>▦</span>分类</a>
    <a href="orders.html"><span>◉</span>订单</a>
</footer>

<div id="toast" class="toast" role="status"></div>

<script src="js/store-identity.js"></script>
<script src="js/store-api.js"></script>
<script src="js/index.js"></script>
</body>
</html>
