name: dev-ops

services:
  mysql:
    image: mysql:8.0.32
    container_name: mysql
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: "123456"
    ports:
      - "127.0.0.1:13306:3306"
    volumes:
      - dev-ops-mysql-data:/var/lib/mysql
      - ./mysql/sql/group_buy_market.sql:/docker-entrypoint-initdb.d/01-group_buy_market.sql:ro
      - ./mysql/sql/3-0-product-admin-and-store.sql:/docker-entrypoint-initdb.d/02-product-admin-and-store.sql:ro
      - ./mysql/sql/3-1-store-order-flow.sql:/docker-entrypoint-initdb.d/03-store-order-flow.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - my-network

  redis:
    image: redis:6.2
    container_name: redis
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - dev-ops-redis-data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - my-network

  rabbitmq:
    image: rabbitmq:3.12.9-management
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - dev-ops-rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - my-network

volumes:
  dev-ops-mysql-data:
    name: dev-ops-mysql-data
  dev-ops-redis-data:
    name: dev-ops-redis-data
  dev-ops-rabbitmq-data:
    name: dev-ops-rabbitmq-data

networks:
  my-network:
    name: dev-ops_my-network
    driver: bridge
